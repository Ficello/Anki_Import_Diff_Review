<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .step-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 6px; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #2563eb; letter-spacing: 0.5px; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .step-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #475569; line-height: 1.4; }
      .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-head { fill: #94a3b8; }
      .safe-tag { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; rx: 3px; }
      .safe-tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #1d4ed8; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Step 1 -->
  <g transform="translate(20, 20)">
    <rect width="165" height="195" class="step-box" />
    <text x="14" y="30" class="step-num">STEP 1</text>
    <text x="14" y="52" class="step-title">Import or Sync</text>
    <text x="14" y="80" class="step-desc">You start importing</text>
    <text x="14" y="98" class="step-desc">an .apkg, .colpkg, or .csv,</text>
    <text x="14" y="116" class="step-desc">or trigger an AnkiCollab</text>
    <text x="14" y="134" class="step-desc">shared deck update.</text>
    <rect x="14" y="160" width="135" height="22" class="safe-tag" />
    <text x="22" y="175" class="safe-tag-text">Active by default</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(195, 110)">
    <line x1="0" y1="0" x2="16" y2="0" class="arrow" />
    <polygon points="16,-4 24,0 16,4" class="arrow-head" />
  </g>

  <!-- Step 2 -->
  <g transform="translate(225, 20)">
    <rect width="165" height="195" class="step-box" />
    <text x="14" y="30" class="step-num">STEP 2</text>
    <text x="14" y="52" class="step-title">Safety Sandbox</text>
    <text x="14" y="80" class="step-desc">Diff Hunk simulates the</text>
    <text x="14" y="98" class="step-desc">import in a safe savepoint</text>
    <text x="14" y="116" class="step-desc">without touching your</text>
    <text x="14" y="134" class="step-desc">live flashcard collection.</text>
    <rect x="14" y="160" width="135" height="22" class="safe-tag" />
    <text x="22" y="175" class="safe-tag-text">Zero overwrite risk</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(400, 110)">
    <line x1="0" y1="0" x2="16" y2="0" class="arrow" />
    <polygon points="16,-4 24,0 16,4" class="arrow-head" />
  </g>

  <!-- Step 3 -->
  <g transform="translate(430, 20)">
    <rect width="165" height="195" class="step-box" />
    <text x="14" y="30" class="step-num">STEP 3</text>
    <text x="14" y="52" class="step-title">Visual Diff Review</text>
    <text x="14" y="80" class="step-desc">Interactive review window:</text>
    <text x="14" y="98" class="step-desc">• Red = removed text</text>
    <text x="14" y="116" class="step-desc">• Green = added text</text>
    <text x="14" y="134" class="step-desc">Accept or reject each</text>
    <text x="14" y="152" class="step-desc">chunk, field, or card</text>
    <text x="14" y="170" class="step-desc">with mouse or keyboard.</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(605, 110)">
    <line x1="0" y1="0" x2="16" y2="0" class="arrow" />
    <polygon points="16,-4 24,0 16,4" class="arrow-head" />
  </g>

  <!-- Step 4 -->
  <g transform="translate(635, 20)">
    <rect width="145" height="195" class="step-box" />
    <text x="14" y="30" class="step-num">STEP 4</text>
    <text x="14" y="52" class="step-title">Final Decision</text>
    <text x="14" y="80" class="step-desc">• Apply: only the</text>
    <text x="14" y="98" class="step-desc">changes you validated</text>
    <text x="14" y="116" class="step-desc">are written to disk.</text>
    <text x="14" y="140" class="step-desc">• Cancel: everything</text>
    <text x="14" y="158" class="step-desc">is aborted; 100% of</text>
    <text x="14" y="176" class="step-desc">your notes are kept.</text>
  </g>
</svg>
